name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install -r requirements_test.txt
      - name: Validate JSON metadata and translations
        run: |
          python -m json.tool custom_components/somfy_io_manager/manifest.json >/dev/null
          python -m json.tool custom_components/somfy_io_manager/strings.json >/dev/null
          python -m json.tool custom_components/somfy_io_manager/translations/en.json >/dev/null
          python -m json.tool custom_components/somfy_io_manager/translations/ca.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Compile Python files
        run: python -m compileall -q custom_components scripts tests
      - name: Build HACS release archive
        run: python scripts/package_hacs_release.py --output /tmp/somfy_io_manager.zip

  homeassistant:
    name: HA behavior (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - homeassistant: "2026.7.0"
            test_plugin: "0.13.344"
          - homeassistant: "2026.10.2"
            test_plugin: "0.13.373"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Home Assistant test dependencies
        run: python -m pip install "pytest-homeassistant-custom-component==${{ matrix.test_plugin }}"
      - name: Test registry ownership and action errors
        run: python -m pytest -q tests_homeassistant -o asyncio_mode=auto
