name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install -r requirements_test.txt
      - name: Validate JSON metadata and translations
        run: |
          python -m json.tool custom_components/somfy_io_manager/manifest.json >/dev/null
          python -m json.tool custom_components/somfy_io_manager/strings.json >/dev/null
          python -m json.tool custom_components/somfy_io_manager/translations/en.json >/dev/null
          python -m json.tool custom_components/somfy_io_manager/translations/ca.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Compile Python files
        run: python -m compileall -q custom_components scripts tests
      - name: Build HACS release archive
        run: python scripts/package_hacs_release.py --output /tmp/somfy_io_manager.zip
