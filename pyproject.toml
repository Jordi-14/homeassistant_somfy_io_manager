[project]
name = "homeassistant-somfy-io-manager"
version = "0.7.0b4"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
